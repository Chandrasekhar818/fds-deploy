apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fds
  template:
    metadata:
      labels:
        app: fds
    spec:
      containers:
        - name: fds
          image: chandu0093/fds-app:latest
          ports:
            - containerPort: 3000
